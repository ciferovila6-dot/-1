<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Транспозитор аккордов и аппликатуры</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #222734;
      --border: #2e3548;
      --text: #eef1f7;
      --muted: #98a2b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --root-dot: #ef4444;
      --finger-dot: #3b82f6;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 64px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    textarea {
      width: 100%;
      min-height: 105px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      resize: vertical;
    }

    textarea:focus,
    select:focus,
    button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .quick-builder {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }

    .quick-builder .label-inline {
      font-size: 0.8rem;
      color: var(--muted);
      margin-right: 4px;
    }

    .mini-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .mini-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }

    .presets span {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 14px;
      margin-top: 18px;
      align-items: end;
    }

    .toggles-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .toggle-check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .toggle-check input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    select,
    .btn {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.92rem;
      padding: 0 12px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #111318;
      font-weight: 700;
      border: none;
      transition: 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .transpose-result {
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.05rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .transposed-chord {
      color: var(--accent);
      font-weight: 700;
    }

    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .copy-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      border-color: var(--success);
      color: var(--success);
    }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot-sample {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .chords-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 16px;
    }

    .chord-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chord-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .chord-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .play-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .play-btn:hover {
      background: var(--accent);
      color: #111318;
      border-color: var(--accent);
    }

    .chord-sub {
      width: 100%;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .voicing-switcher {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin-bottom: 8px;
    }

    .voicing-btn {
      padding: 2px 8px;
      font-size: 0.74rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
    }

    .voicing-btn.active {
      background: var(--accent);
      color: #111;
      border-color: var(--accent);
      font-weight: 700;
    }

    svg.fretboard {
      width: 186px;
      height: 210px;
      user-select: none;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Транспозитор аккордов и аппликатуры</h1>
      <p class="subtitle">Транспонируйте аккорды, подбирайте позиции с баррэ, каподастр и слушайте звучание</p>
    </header>

    <section class="panel">
      <label for="chordInput">Текст или последовательность аккордов</label>
      <textarea id="chordInput" placeholder="Например: Am  F  C  G&#10;или: [Em7] Пусть бегут неуклюже [Am7] пешеходы [D7] по лужам..."></textarea>

      <div class="quick-builder">
        <span class="label-inline">Быстрый ввод:</span>
        <button type="button" class="mini-btn" data-insert="C">C</button>
        <button type="button" class="mini-btn" data-insert="D">D</button>
        <button type="button" class="mini-btn" data-insert="E">E</button>
        <button type="button" class="mini-btn" data-insert="F">F</button>
        <button type="button" class="mini-btn" data-insert="G">G</button>
        <button type="button" class="mini-btn" data-insert="A">A</button>
        <button type="button" class="mini-btn" data-insert="B">B</button>
        <button type="button" class="mini-btn" data-insert="#">#</button>
        <button type="button" class="mini-btn" data-insert="b">b</button>
        <button type="button" class="mini-btn" data-insert="m">m</button>
        <button type="button" class="mini-btn" data-insert="7">7</button>
        <button type="button" class="mini-btn" data-insert="maj7">maj7</button>
        <button type="button" class="mini-btn" data-insert="sus4">sus4</button>
        <button type="button" class="mini-btn" data-insert="add9">add9</button>
        <button type="button" class="mini-btn" data-insert="  ">Пробел</button>
      </div>

      <div class="presets">
        <span>Примеры:</span>
        <button type="button" class="chip" data-preset="Am  F  C  G">Am - F - C - G</button>
        <button type="button" class="chip" data-preset="C  G/B  Am  F  Dm7  G7">C - G/B - Am - F - Dm7 - G7</button>
        <button type="button" class="chip" data-preset="Dsus4  D  Asus2  Bm7">Dsus4 - D - Asus2 - Bm7</button>
        <button type="button" class="chip" data-preset="Cm7  Fm7  Bb7  Ebmaj7">Джаз II-V-I</button>
        <button type="button" class="chip" data-preset="Cdim  Caug  C6  Cadd9">Редкие (dim/aug/6/add9)</button>
      </div>

      <div class="controls">
        <div>
          <label for="semitonesSelect">Сдвиг (полутонов)</label>
          <select id="semitonesSelect"></select>
        </div>

        <div>
          <label for="accidentalSelect">Знаки альтерации</label>
          <select id="accidentalSelect">
            <option value="auto">Авто (по тональности)</option>
            <option value="sharp">Предпочитать диезы (#)</option>
            <option value="flat">Предпочитать бемоли (b)</option>
          </select>
        </div>

        <div>
          <label for="tuningSelect">Строй гитары</label>
          <select id="tuningSelect">
            <option value="standard">Стандартный (E A D G B E)</option>
            <option value="dropd">Drop D (D A D G B E)</option>
            <option value="eb">Half-step down (Eb Ab Db Gb Bb Eb)</option>
            <option value="openg">Open G (D G D G B D)</option>
            <option value="dadgad">DADGAD (D A D G A D)</option>
          </select>
        </div>

        <div>
          <label for="capoSelect">Каподастр</label>
          <select id="capoSelect"></select>
        </div>

        <div>
          <button type="button" class="btn btn-primary" id="transposeBtn">Обновить</button>
        </div>
      </div>

      <div class="toggles-row">
        <label class="toggle-check">
          <input type="checkbox" id="showNotesToggle" />
          Показывать ноты вместо пальцев
        </label>
        <label class="toggle-check">
          <input type="checkbox" id="leftHandedToggle" />
          Леворукий режим (зеркальный гриф)
        </label>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar-top">
        <label style="margin:0;">Результат транспонирования</label>
        <button type="button" class="copy-btn" id="copyBtn">Скопировать текст</button>
      </div>
      <div id="transposedOutput" class="transpose-result"></div>
    </section>

    <section class="panel">
      <div class="toolbar-top">
        <label style="margin:0;">Аппликатуры найденных аккордов</label>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="dot-sample" style="background:#ef4444;"></span> Тоника</div>
        <div class="legend-item"><span class="dot-sample" style="background:#3b82f6;"></span> Остальные ноты</div>
        <div class="legend-item"><span><b>O</b> — открытая</span></div>
        <div class="legend-item"><span><b>X</b> — не звучит</span></div>
      </div>
      <div id="chordsGrid" class="chords-grid"></div>
    </section>
  </div>

  <script>
    const SHARP_NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const FLAT_NOTES  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    const TUNINGS = {
      standard: { name: "Standard", notes: [4, 9, 2, 7, 11, 4] },
      dropd:    { name: "Drop D",   notes: [2, 9, 2, 7, 11, 4] },
      eb:       { name: "Eb",       notes: [3, 8, 1, 6, 10, 3] },
      openg:    { name: "Open G",   notes: [2, 7, 2, 7, 11, 2] },
      dadgad:   { name: "DADGAD",   notes: [2, 9, 2, 7, 9, 2] }
    };

    // Базовые формы от 6-й (индекс 0) к 1-й (индекс 5) струне
    const SHAPE_LIBRARY = {
      majE:   { label: "Баррэ E",    anchor: 0, barreFret: 0, frets: [0, 2, 2, 1, 0, 0], fingers: [0, 2, 3, 1, 0, 0] },
      majA:   { label: "Баррэ A",    anchor: 1, barreFret: 0, frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 0, 1, 1, 1, 0] },
      minE:   { label: "Баррэ Em",   anchor: 0, barreFret: 0, frets: [0, 2, 2, 0, 0, 0], fingers: [0, 2, 3, 0, 0, 0] },
      minA:   { label: "Баррэ Am",   anchor: 1, barreFret: 0, frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 0, 2, 3, 1, 0] },
      dom7E:  { label: "7 (6 стр.)", anchor: 0, barreFret: 0, frets: [0, 2, 0, 1, 0, 0], fingers: [0, 2, 0, 1, 0, 0] },
      dom7A:  { label: "7 (5 стр.)", anchor: 1, barreFret: 0, frets: [-1, 0, 2, 0, 2, 0], fingers: [0, 0, 2, 0, 3, 0] },
      min7E:  { label: "m7 (6 стр.)",anchor: 0, barreFret: 0, frets: [0, 2, 0, 0, 0, 0], fingers: [0, 2, 0, 0, 0, 0] },
      min7A:  { label: "m7 (5 стр.)",anchor: 1, barreFret: 0, frets: [-1, 0, 2, 0, 1, 0], fingers: [0, 0, 2, 0, 1, 0] },
      maj7E:  { label: "maj7 (6)",   anchor: 0, barreFret: 0, frets: [0, 2, 1, 1, 0, 0], fingers: [0, 3, 1, 2, 0, 0] },
      maj7A:  { label: "maj7 (5)",   anchor: 1, barreFret: 0, frets: [-1, 0, 2, 1, 2, 0], fingers: [0, 0, 2, 1, 3, 0] },
      sus2A:  { label: "sus2 (5)",   anchor: 1, barreFret: 0, frets: [-1, 0, 2, 2, 0, 0], fingers: [0, 0, 1, 2, 0, 0] },
      sus4E:  { label: "sus4 (6)",   anchor: 0, barreFret: 0, frets: [0, 2, 2, 2, 0, 0], fingers: [0, 2, 3, 4, 0, 0] },
      sus4A:  { label: "sus4 (5)",   anchor: 1, barreFret: 0, frets: [-1, 0, 2, 2, 3, 0], fingers: [0, 0, 1, 2, 4, 0] },
      dimA:   { label: "dim (5)",    anchor: 1, barreFret: 0, frets: [-1, 0, 1, 2, 1, -1], fingers: [0, 0, 1, 3, 2, 0] },
      augA:   { label: "aug (5)",    anchor: 1, barreFret: 0, frets: [-1, 0, 3, 2, 2, 1], fingers: [0, 0, 4, 2, 3, 1] },
      sixE:   { label: "6 (6 стр.)", anchor: 0, barreFret: 0, frets: [0, 2, 2, 1, 2, 0], fingers: [0, 2, 3, 1, 4, 0] },
      add9A:  { label: "add9 (5)",   anchor: 1, barreFret: 0, frets: [-1, 0, 2, 4, 2, 0], fingers: [0, 0, 1, 4, 2, 0] }
    };

    const OPEN_CHORDS = {
      "C":    [{ label: "Открытый", frets: [-1, 3, 2, 0, 1, 0], fingers: [0, 3, 2, 0, 1, 0], barre: null }],
      "G":    [{ label: "Открытый", frets: [3, 2, 0, 0, 0, 3],  fingers: [2, 1, 0, 0, 0, 3], barre: null }],
      "D":    [{ label: "Открытый", frets: [-1, -1, 0, 2, 3, 2], fingers: [0, 0, 0, 1, 3, 2], barre: null }],
      "Dm":   [{ label: "Открытый", frets: [-1, -1, 0, 2, 3, 1], fingers: [0, 0, 0, 2, 3, 1], barre: null }],
      "Dm7":  [{ label: "Открытый", frets: [-1, -1, 0, 2, 1, 1], fingers: [0, 0, 0, 2, 1, 1], barre: null }],
      "E":    [{ label: "Открытый", frets: [0, 2, 2, 1, 0, 0],  fingers: [0, 2, 3, 1, 0, 0], barre: null }],
      "Em":   [{ label: "Открытый", frets: [0, 2, 2, 0, 0, 0],  fingers: [0, 2, 3, 0, 0, 0], barre: null }],
      "A":    [{ label: "Открытый", frets: [-1, 0, 2, 2, 2, 0], fingers: [0, 0, 1, 2, 3, 0], barre: null }],
      "Am":   [{ label: "Открытый", frets: [-1, 0, 2, 2, 1, 0], fingers: [0, 0, 2, 3, 1, 0], barre: null }],
      "Asus2":[{ label: "Открытый", frets: [-1, 0, 2, 2, 0, 0], fingers: [0, 0, 1, 2, 0, 0], barre: null }],
      "Asus4":[{ label: "Открытый", frets: [-1, 0, 2, 2, 3, 0], fingers: [0, 0, 1, 2, 4, 0], barre: null }],
      "Dsus4":[{ label: "Открытый", frets: [-1, -1, 0, 2, 3, 3], fingers: [0, 0, 0, 1, 3, 4], barre: null }]
    };

    const semitonesSelect = document.getElementById("semitonesSelect");
    for (let s = -11; s <= 12; s++) {
      const opt = document.createElement("option");
      opt.value = s;
      if (s === 0) opt.textContent = "0 (без сдвига)";
      else if (s > 0) opt.textContent = `+${s} полутон${pluralSemitone(s)}`;
      else opt.textContent = `${s} полутон${pluralSemitone(Math.abs(s))}`;
      if (s === 2) opt.selected = true;
      semitonesSelect.appendChild(opt);
    }

    const capoSelect = document.getElementById("capoSelect");
    for (let c = 0; c <= 7; c++) {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c === 0 ? "Без каподастра" : `Каподастр: ${c} лад`;
      capoSelect.appendChild(opt);
    }

    function pluralSemitone(n) {
      if (n % 10 === 1 && n % 100 !== 11) return "";
      if ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) return "а";
      return "ов";
    }

    function noteToIndex(note) {
      const map = {
        "C": 0, "B#": 0,
        "C#": 1, "Db": 1,
        "D": 2,
        "D#": 3, "Eb": 3,
        "E": 4, "Fb": 4,
        "F": 5, "E#": 5,
        "F#": 6, "Gb": 6,
        "G": 7,
        "G#": 8, "Ab": 8,
        "A": 9,
        "A#": 10, "Bb": 10,
        "B": 11, "Cb": 11
      };
      return map[note] ?? null;
    }

    function indexToNote(idx, preferFlat = false) {
      const norm = ((idx % 12) + 12) % 12;
      return preferFlat ? FLAT_NOTES[norm] : SHARP_NOTES[norm];
    }

    function shouldUseFlat(semitones, mode, targetRootIdx) {
      if (mode === "sharp") return false;
      if (mode === "flat") return true;
      const flatRoots = new Set([5, 10, 3, 8, 1, 6]);
      if (flatRoots.has(((targetRootIdx % 12) + 12) % 12)) return true;
      return semitones < 0;
    }

    function parseChord(token) {
      const match = token.match(/^([A-G](?:#|b)?)([a-zA-Z0-9#bsusaddmajdimaug°ø+-]*)(?:\/([A-G](?:#|b)?))?$/);
      if (!match) return null;
      const rootIdx = noteToIndex(match[1]);
      if (rootIdx === null) return null;
      const quality = match[2] || "";
      const bassIdx = match[3] ? noteToIndex(match[3]) : null;
      return {
        raw: token,
        root: match[1],
        rootIdx,
        quality,
        bass: match[3] || null,
        bassIdx
      };
    }

    function transposeChordToken(token, semitones, accidentalMode) {
      const parsed = parseChord(token);
      if (!parsed) return { text: token, chord: null };

      const newRootIdx = (((parsed.rootIdx + semitones) % 12) + 12) % 12;
      const useFlat = shouldUseFlat(semitones, accidentalMode, newRootIdx);
      const newRoot = indexToNote(newRootIdx, useFlat);

      let newBassStr = "";
      let newBassIdx = null;
      if (parsed.bassIdx !== null) {
        newBassIdx = (((parsed.bassIdx + semitones) % 12) + 12) % 12;
        newBassStr = "/" + indexToNote(newBassIdx, useFlat);
      }

      const newToken = `${newRoot}${parsed.quality}${newBassStr}`;
      return {
        text: newToken,
        chord: {
          name: newToken,
          root: newRoot,
          rootIdx: newRootIdx,
          quality: parsed.quality,
          bassIdx: newBassIdx,
          useFlat
        }
      };
    }

    function transposeText(text, semitones, accidentalMode) {
      const parts = text.split(/(\s+)/);
      const foundChords = [];
      const seenKeys = new Set();

      const renderedHtml = parts.map(part => {
        if (/^\s+$/.test(part) || part === "") return escapeHtml(part);

        const bracketMatch = part.match(/^([\[\(])(.+?)([\]\)])$/);
        if (bracketMatch) {
          const [, openB, inner, closeB] = bracketMatch;
          const res = transposeChordToken(inner, semitones, accidentalMode);
          if (res.chord) {
            addUniqueChord(res.chord, foundChords, seenKeys);
            return `${escapeHtml(openB)}<span class="transposed-chord">${escapeHtml(res.text)}</span>${escapeHtml(closeB)}`;
          }
        }

        const res = transposeChordToken(part, semitones, accidentalMode);
        if (res.chord) {
          addUniqueChord(res.chord, foundChords, seenKeys);
          return `<span class="transposed-chord">${escapeHtml(res.text)}</span>`;
        }

        return escapeHtml(part);
      }).join("");

      return { renderedHtml, foundChords };
    }

    function addUniqueChord(chord, list, seen) {
      const key = `${chord.rootIdx}|${chord.quality}|${chord.bassIdx ?? ""}`;
      if (!seen.has(key)) {
        seen.add(key);
        list.push(chord);
      }
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function classifyQuality(qRaw) {
      const q = qRaw.toLowerCase();
      if (q.includes("dim") || q.includes("°") || q.includes("ø")) return "dim";
      if (q.includes("aug")) return "aug";
      if (q.includes("sus2")) return "sus2";
      if (q.includes("sus4") || q === "sus") return "sus4";
      if (q.includes("add9")) return "add9";
      if (q.includes("maj7")) return "maj7";
      if (q.startsWith("m") && !q.startsWith("maj") && q.includes("7")) return "min7";
      if (!q.startsWith("m") && q.includes("7")) return "dom7";
      if (q.includes("6") && !q.startsWith("m")) return "six";
      if (q.startsWith("m") && !q.startsWith("maj")) return "min";
      return "maj";
    }

    function shiftShapeWithBarre(baseShape, shift, openStrings) {
      const frets = baseShape.frets.map(f => (f === -1 ? -1 : f + shift));
      const minPressed = Math.min(...frets.filter(f => f > 0));
      const hasBarre = shift > 0;

      const fingers = frets.map((f, idx) => {
        if (f <= 0) return 0;
        if (hasBarre) {
          if (f === minPressed) return 1;
          const rel = f - minPressed + 1;
          return Math.min(4, Math.max(2, rel));
        }
        return baseShape.fingers[idx] || 1;
      });

      let barre = null;
      if (hasBarre && Number.isFinite(minPressed)) {
        const activeIndices = frets
          .map((f, i) => (f >= minPressed ? i : -1))
          .filter(i => i !== -1);
        if (activeIndices.length >= 2) {
          barre = {
            fret: minPressed,
            fromString: Math.max(baseShape.anchor, activeIndices[0]),
            toString: activeIndices[activeIndices.length - 1],
            finger: 1
          };
        }
      }

      const fretNum = shift === 0 ? "откр." : `${shift} лад`;
      return {
        label: `${baseShape.label.split(" ")[0]} (${fretNum})`,
        frets,
        fingers,
        barre
      };
    }

    function getVoicingsForChord(chord, tuningKey, capo) {
      const tuning = TUNINGS[tuningKey] || TUNINGS.standard;
      const effectiveOpen = tuning.notes.map(n => (n + capo) % 12);
      const kind = classifyQuality(chord.quality);
      const voicings = [];

      // Открытые формы только для стандартного строя и без каподастра
      if (tuningKey === "standard" && capo === 0) {
        const openKey = `${chord.root}${kind === "min" ? "m" : kind === "min7" ? "m7" : kind === "sus2" ? "sus2" : kind === "sus4" ? "sus4" : ""}`;
        if (OPEN_CHORDS[openKey]) {
          OPEN_CHORDS[openKey].forEach(v => voicings.push({ ...v }));
        }
      }

      const pairMap = {
        maj:  [SHAPE_LIBRARY.majA, SHAPE_LIBRARY.majE],
        min:  [SHAPE_LIBRARY.minA, SHAPE_LIBRARY.minE],
        dom7: [SHAPE_LIBRARY.dom7A, SHAPE_LIBRARY.dom7E],
        min7: [SHAPE_LIBRARY.min7A, SHAPE_LIBRARY.min7E],
        maj7: [SHAPE_LIBRARY.maj7A, SHAPE_LIBRARY.maj7E],
        sus2: [SHAPE_LIBRARY.sus2A, SHAPE_LIBRARY.majE],
        sus4: [SHAPE_LIBRARY.sus4A, SHAPE_LIBRARY.sus4E],
        dim:  [SHAPE_LIBRARY.dimA, SHAPE_LIBRARY.minE],
        aug:  [SHAPE_LIBRARY.augA, SHAPE_LIBRARY.majE],
        six:  [SHAPE_LIBRARY.sixE, SHAPE_LIBRARY.majA],
        add9: [SHAPE_LIBRARY.add9A, SHAPE_LIBRARY.majE]
      };

      const shapes = pairMap[kind] || pairMap.maj;

      for (const baseShape of shapes) {
        const openPitch = effectiveOpen[baseShape.anchor];
        const shift = (((chord.rootIdx - openPitch) % 12) + 12) % 12;
        voicings.push(shiftShapeWithBarre(baseShape, shift, effectiveOpen));
      }

      const unique = [];
      const seen = new Set();
      for (const v of voicings) {
        const key = v.frets.join(",");
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(v);
        }
      }
      return unique.slice(0, 3);
    }

    function renderFretboardSVG(voicing, rootIdx, bassIdx, tuningKey, capo, options) {
      const { showNotes, leftHanded, useFlat } = options;
      const tuning = TUNINGS[tuningKey] || TUNINGS.standard;
      const effectiveOpen = tuning.notes.map(n => (n + capo) % 12);

      const frets = voicing.frets;
      const positiveFrets = frets.filter(f => f > 0);
      const minFret = positiveFrets.length ? Math.min(...positiveFrets) : 1;
      const maxFret = positiveFrets.length ? Math.max(...positiveFrets) : 4;

      const startFret = maxFret <= 4 ? 1 : minFret;
      const numFrets = 4;

      const width = 186;
      const height = 210;
      const leftPad = 32;
      const topPad = 38;
      const stringGap = 22;
      const fretGap = 35;

      const mapStringPos = (s) => {
        const visualIdx = leftHanded ? (5 - s) : s;
        return leftPad + visualIdx * stringGap;
      };

      let svg = `<svg class="fretboard" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;

      if (startFret > 1) {
        svg += `<text x="8" y="${topPad + fretGap * 0.62}" fill="#98a2b8" font-size="11" font-weight="700">${startFret}фр</text>`;
      }

      const nutHeight = startFret === 1 ? 5 : 2;
      svg += `<rect x="${leftPad}" y="${topPad - nutHeight}" width="${stringGap * 5}" height="${nutHeight}" fill="#eef1f7" rx="1" />`;

      for (let f = 1; f <= numFrets; f++) {
        const y = topPad + f * fretGap;
        svg += `<line x1="${leftPad}" y1="${y}" x2="${leftPad + stringGap * 5}" y2="${y}" stroke="#64748b" stroke-width="1.5" />`;
      }

      // Струны (для правши 6-я слева, для левши — справа)
      for (let s = 0; s < 6; s++) {
        const x = mapStringPos(s);
        const strokeW = 1 + (5 - s) * 0.32;
        svg += `<line x1="${x}" y1="${topPad}" x2="${x}" y2="${topPad + numFrets * fretGap}" stroke="#cbd5e1" stroke-width="${strokeW}" />`;
      }

      // Дуга баррэ
      if (voicing.barre) {
        const { fret, fromString, toString, finger } = voicing.barre;
        const offset = fret - startFret + 1;
        if (offset >= 1 && offset <= numFrets) {
          const cy = topPad + (offset - 0.5) * fretGap;
          const x1 = mapStringPos(fromString);
          const x2 = mapStringPos(toString);
          const minX = Math.min(x1, x2);
          const maxX = Math.max(x1, x2);
          svg += `<rect x="${minX - 8}" y="${cy - 8}" width="${(maxX - minX) + 16}" height="16" rx="8" fill="#3b82f6" opacity="0.85" />`;
          if (!showNotes && finger) {
            svg += `<text x="${(minX + maxX) / 2}" y="${cy + 3.5}" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">${finger}</text>`;
          }
        }
      }

      // Точки и маркеры над порожком
      for (let s = 0; s < 6; s++) {
        const x = mapStringPos(s);
        const fretVal = frets[s];
        const statusY = topPad - 13;

        if (fretVal === -1) {
          svg += `<text x="${x}" y="${statusY}" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">X</text>`;
        } else if (fretVal === 0) {
          const notePitch = effectiveOpen[s] % 12;
          const isRoot = notePitch === rootIdx;
          const isBass = bassIdx !== null && notePitch === bassIdx;
          const strokeCol = isRoot ? "#ef4444" : isBass ? "#f59e0b" : "#3b82f6";
          if (showNotes) {
            const noteLabel = indexToNote(notePitch, useFlat);
            svg += `<text x="${x}" y="${statusY}" text-anchor="middle" fill="${strokeCol}" font-size="10" font-weight="700">${noteLabel}</text>`;
          } else {
            svg += `<circle cx="${x}" cy="${statusY - 4}" r="5.5" fill="none" stroke="${strokeCol}" stroke-width="2" />`;
          }
        } else {
          const fretOffset = fretVal - startFret + 1;
          if (fretOffset >= 1 && fretOffset <= numFrets) {
            const cy = topPad + (fretOffset - 0.5) * fretGap;
            const notePitch = (effectiveOpen[s] + fretVal) % 12;
            const isRoot = notePitch === rootIdx;
            const isBass = bassIdx !== null && notePitch === bassIdx;
            const fillColor = isRoot ? "#ef4444" : isBass ? "#f59e0b" : "#3b82f6";

            const isBarreSpan = voicing.barre &&
              voicing.barre.fret === fretVal &&
              s >= Math.min(voicing.barre.fromString, voicing.barre.toString) &&
              s <= Math.max(voicing.barre.fromString, voicing.barre.toString);

            if (!isBarreSpan || isRoot) {
              svg += `<circle cx="${x}" cy="${cy}" r="8.8" fill="${fillColor}" />`;
            }

            const labelText = showNotes
              ? indexToNote(notePitch, useFlat)
              : (voicing.fingers[s] || "");

            if (labelText && (!isBarreSpan || isRoot || showNotes)) {
              svg += `<text x="${x}" y="${cy + 3.5}" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="700">${labelText}</text>`;
            }
          }
        }
      }

      svg += `</svg>`;
      return svg;
    }

    // Озвучка аккорда через Web Audio API
    let audioCtx = null;
    function playVoicingAudio(voicing, tuningKey, capo) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const tuning = TUNINGS[tuningKey] || TUNINGS.standard;
      // MIDI-ноты открытых струн (6-я -> 1-я)
      const baseMidiStandard = [40, 45, 50, 55, 59, 64];
      const deltaFromStd = tuning.notes.map((n, i) => {
        let diff = (n - TUNINGS.standard.notes[i]) % 12;
        if (diff > 6) diff -= 12;
        if (diff < -6) diff += 12;
        return diff;
      });

      const now = audioCtx.currentTime;
      let step = 0;

      voicing.frets.forEach((f, s) => {
        if (f < 0) return;
        const midi = baseMidiStandard[s] + deltaFromStd[s] + capo + f;
        const freq = 440 * Math.pow(2, (midi - 69) / 12);

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now + step * 0.055);

        const startT = now + step * 0.055;
        gain.gain.setValueAtTime(0.0001, startT);
        gain.gain.exponentialRampToValueAtTime(0.14, startT + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startT + 1.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startT);
        osc.stop(startT + 1.2);
        step++;
      });
    }

    function renderAll() {
      const rawText = document.getElementById("chordInput").value;
      const semitones = parseInt(semitonesSelect.value, 10);
      const accidentalMode = document.getElementById("accidentalSelect").value;
      const tuningKey = document.getElementById("tuningSelect").value;
      const capo = parseInt(capoSelect.value, 10);
      const showNotes = document.getElementById("showNotesToggle").checked;
      const leftHanded = document.getElementById("leftHandedToggle").checked;

      const outputEl = document.getElementById("transposedOutput");
      const gridEl = document.getElementById("chordsGrid");

      const { renderedHtml, foundChords } = transposeText(rawText, semitones, accidentalMode);
      outputEl.innerHTML = renderedHtml || `<span class="empty-msg">Введите аккорды выше, чтобы увидеть результат.</span>`;

      gridEl.innerHTML = "";
      if (!foundChords.length) {
        gridEl.innerHTML = `<div class="empty-msg">Распознанных аккордов пока нет. Попробуйте ввести, например, <b>Am F C G</b>.</div>`;
        return;
      }

      foundChords.forEach(chord => {
        const voicings = getVoicingsForChord(chord, tuningKey, capo);
        let activeIdx = 0;

        const card = document.createElement("div");
        card.className = "chord-card";

        const header = document.createElement("div");
        header.className = "chord-header";

        const titleEl = document.createElement("span");
        titleEl.className = "chord-name";
        titleEl.textContent = chord.name;

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "play-btn";
        playBtn.textContent = "▶ Звук";
        playBtn.addEventListener("click", () => {
          playVoicingAudio(voicings[activeIdx], tuningKey, capo);
        });

        header.appendChild(titleEl);
        header.appendChild(playBtn);
        card.appendChild(header);

        const subEl = document.createElement("div");
        subEl.className = "chord-sub";
        const capoNoteIdx = (((chord.rootIdx - capo) % 12) + 12) % 12;
        const capoHint = capo > 0 ? `Форма: ${indexToNote(capoNoteIdx, chord.useFlat)}` : `Тон: ${chord.root}`;
        subEl.innerHTML = `<span>${escapeHtml(capoHint)}</span><span>${escapeHtml(TUNINGS[tuningKey].name)}</span>`;
        card.appendChild(subEl);

        const switcher = document.createElement("div");
        switcher.className = "voicing-switcher";

        const svgWrapper = document.createElement("div");

        const redrawVoicing = () => {
          [...switcher.children].forEach((btn, i) => {
            btn.classList.toggle("active", i === activeIdx);
          });
          svgWrapper.innerHTML = renderFretboardSVG(
            voicings[activeIdx],
            chord.rootIdx,
            chord.bassIdx,
            tuningKey,
            capo,
            { showNotes, leftHanded, useFlat: chord.useFlat }
          );
        };

        voicings.forEach((v, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "voicing-btn";
          btn.textContent = v.label;
          btn.addEventListener("click", () => {
            activeIdx = i;
            redrawVoicing();
          });
          switcher.appendChild(btn);
        });

        card.appendChild(switcher);
        card.appendChild(svgWrapper);
        gridEl.appendChild(card);

        redrawVoicing();
      });
    }

    document.getElementById("transposeBtn").addEventListener("click", renderAll);
    document.getElementById("chordInput").addEventListener("input", renderAll);
    semitonesSelect.addEventListener("change", renderAll);
    document.getElementById("accidentalSelect").addEventListener("change", renderAll);
    document.getElementById("tuningSelect").addEventListener("change", renderAll);
    capoSelect.addEventListener("change", renderAll);
    document.getElementById("showNotesToggle").addEventListener("change", renderAll);
    document.getElementById("leftHandedToggle").addEventListener("change", renderAll);

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.getElementById("chordInput").value = chip.dataset.preset;
        renderAll();
      });
    });

    document.querySelectorAll(".mini-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const ta = document.getElementById("chordInput");
        const insert = btn.dataset.insert;
        const start = ta.selectionStart ?? ta.value.length;
        const end = ta.selectionEnd ?? ta.value.length;
        ta.value = ta.value.slice(0, start) + insert + ta.value.slice(end);
        const newPos = start + insert.length;
        ta.focus();
        ta.setSelectionRange(newPos, newPos);
        renderAll();
      });
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const text = document.getElementById("transposedOutput").innerText;
      if (!text.trim()) return;
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById("copyBtn");
        const prev = btn.textContent;
        btn.textContent = "Скопировано!";
        setTimeout(() => (btn.textContent = prev), 1400);
      } catch (_) {}
    });

    document.getElementById("chordInput").value = "Am  F  C  G";
    renderAll();
  </script>
</body>
</html>
